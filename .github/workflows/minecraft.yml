name: Minecraft Cloud Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Minecraft Server with Universal Multi-Version & Bedrock Support
        run: |
          mkdir -p mc_server/plugins
          cd mc_server

          echo "⬇️ 1. Lade Purpur Server..."
          curl -sL https://api.purpurmc.org/v2/purpur/1.21.4/latest/download -o server.jar || curl -sL https://api.purpurmc.org/v2/purpur/1.21.1/latest/download -o server.jar
          echo "eula=true" > eula.txt

          echo "⚙️ 2. Konfiguriere Server Properties (Offline Mode für alle Versionen)..."
          cat << 'EOF' > server.properties
          online-mode=false
          motd=§a§lWebHostMC Server §7| §eAlle Versionen Erlaubt (1.7 - 1.21.4 & Bedrock)
          server-port=25565
          max-players=50
          difficulty=normal
          gamemode=survival
          pvp=true
          enable-status=true
          EOF

          echo "⬇️ 3. Lade alle Multi-Version & Bedrock Plugins herunter..."
          # ViaVersion: Für alle neueren Versionen (1.21.2, 1.21.3, 1.21.4, Snapshots)
          curl -sL https://github.com/ViaVersion/ViaVersion/releases/download/5.2.1/ViaVersion-5.2.1.jar -o plugins/ViaVersion.jar
          # ViaBackwards: Für alle älteren Versionen (1.20, 1.19, 1.18, 1.16, 1.12 etc.)
          curl -sL https://github.com/ViaVersion/ViaBackwards/releases/download/5.2.1/ViaBackwards-5.2.1.jar -o plugins/ViaBackwards.jar
          # ViaRewind: Für 1.8 & 1.7
          curl -sL https://github.com/ViaVersion/ViaRewind/releases/download/3.0.7/ViaRewind-3.0.7.jar -o plugins/ViaRewind.jar
          # GeyserMC: Für Bedrock / Handy / Konsole
          curl -sL https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot -o plugins/Geyser-Spigot.jar
          # Floodgate: Für Bedrock ohne Java-Zwang
          curl -sL https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot -o plugins/floodgate-spigot.jar

          echo "Installierte Plugins:"
          ls -la plugins/

          echo "⬇️ 4. Lade Cloud-Tunnel herunter..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore

          # Starte den Tunnel mit Port 33305
          ./bore local 25565 --to bore.pub --port 33305 > bore.log 2>&1 &
          sleep 4

          echo ""
          echo "=========================================================="
          echo "🔥 DEINE ECHTE MINECRAFT SERVER IP (ALLE VERSIONEN & BEDROCK):"
          echo "=========================================================="
          cat bore.log
          echo "=========================================================="
          echo ""

          echo "🚀 STARTE MINECRAFT SERVER (6 GB RAM)..."
          java -Xms4G -Xmx6G -jar server.jar nogui
