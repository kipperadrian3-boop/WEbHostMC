name: Minecraft Cloud Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Minecraft Server & Instant Cloud Tunnel
        run: |
          mkdir -p mc_server
          cd mc_server

          echo "⬇️ Lade Purpur 1.21.1 herunter..."
          wget -q https://api.purpurmc.org/v2/purpur/1.21.1/latest/download -O server.jar
          echo "eula=true" > eula.txt

          echo "⬇️ Lade ultraschnellen Cloud-Tunnel herunter..."
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

          # Starte den Tunnel
          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          sleep 4

          echo ""
          echo "=========================================================="
          echo "🔥 DEINE ECHTE MINECRAFT SERVER IP (DIREKT BEITRETEN):"
          echo "=========================================================="
          cat bore.log
          echo "=========================================================="
          echo ""

          echo "🚀 STARTE MINECRAFT SERVER (6 GB RAM)..."
          java -Xms4G -Xmx6G -jar server.jar nogui
