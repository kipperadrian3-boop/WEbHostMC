name: Minecraft Cloud Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_server]

# 🔴 WICHTIG: Das beendet den alten Server automatisch, damit der Port 33305 frei wird!
concurrency:
  group: minecraft-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Start Minecraft Server with Universal Multi-Version & Bedrock Support
        run: |
          mkdir -p mc_server/plugins
          cd mc_server

          echo "⬇️ 1. Lade neuesten Purpur 26.2 Server..."
          curl -sL https://api.purpurmc.org/v2/purpur/26.2/latest/download -o server.jar || curl -sL https://api.purpurmc.org/v2/purpur/1.21.1/latest/download -o server.jar
          echo "eula=true" > eula.txt

          echo "⚙️ 2. Konfiguriere Server Properties (Offline Mode für alle Versionen)..."
          cat << 'EOF' > server.properties
          online-mode=false
          motd=§a§lWebHostMC Server §7| §eAlle Versionen Erlaubt (1.9 - 26.2 & Bedrock)
          server-port=25565
          max-players=50
          difficulty=normal
          gamemode=survival
          pvp=true
          enable-status=true
          EOF

          echo "⬇️ 3. Lade alle Multi-Version & Bedrock Plugins herunter..."
          echo "⬇️ 3. Lade alle Multi-Version & Bedrock Plugins herunter..."
          # ViaVersion 5.11.0 (Neueste Version für 26.2 Support)
          curl -sL https://github.com/ViaVersion/ViaVersion/releases/download/5.11.0/ViaVersion-5.11.0.jar -o plugins/ViaVersion.jar
          # ViaBackwards 5.11.0
          curl -sL https://github.com/ViaVersion/ViaBackwards/releases/download/5.11.0/ViaBackwards-5.11.0.jar -o plugins/ViaBackwards.jar
          # GeyserMC
          curl -sL https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot -o plugins/Geyser-Spigot.jar
          # Floodgate
          curl -sL https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot -o plugins/floodgate-spigot.jar

          echo "Installierte Plugins:"
          ls -la plugins/

          echo "⬇️ 4. Lade Cloud-Tunnel herunter..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore

          # Starte den Tunnel (Zufälliger Port, damit es keine 1.21.1 Fremd-Server Überschneidungen gibt!)
          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          sleep 4

          echo ""
          echo "=========================================================="
          echo "🔥 DEINE ECHTE MINECRAFT SERVER IP (ALLE VERSIONEN & BEDROCK):"
          echo "=========================================================="
          cat bore.log
          echo "=========================================================="
          echo ""

          echo "🚀 STARTE MINECRAFT SERVER (6 GB RAM)..."
          java -Xms4G -Xmx6G -jar server.jar nogui
