name: Minecraft Cloud Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Minecraft Server with All-Version Plugins & Tunnel
        run: |
          mkdir -p mc_server/plugins
          cd mc_server

          echo "⬇️ 1. Lade Purpur 1.21.1 Server..."
          wget -q https://api.purpurmc.org/v2/purpur/1.21.1/latest/download -O server.jar
          echo "eula=true" > eula.txt

          echo "⬇️ 2. Lade Multi-Version Plugins (ViaVersion & ViaBackwards)..."
          # ViaVersion (Neuere Versionen)
          wget -q https://github.com/ViaVersion/ViaVersion/releases/download/5.2.1/ViaVersion-5.2.1.jar -O plugins/ViaVersion.jar || true
          # ViaBackwards (Ältere Versionen wie 1.16, 1.12 etc.)
          wget -q https://github.com/ViaVersion/ViaBackwards/releases/download/5.2.1/ViaBackwards-5.2.1.jar -O plugins/ViaBackwards.jar || true
          # ViaRewind (Bis 1.8 / 1.7)
          wget -q https://github.com/ViaVersion/ViaRewind/releases/download/3.0.7/ViaRewind-3.0.7.jar -O plugins/ViaRewind.jar || true

          echo "⬇️ 3. Lade Cloud-Tunnel herunter..."
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

          # Starte den Tunnel
          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          sleep 4

          echo ""
          echo "=========================================================="
          echo "🔥 DEINE ECHTE MINECRAFT SERVER IP (ALLE VERSIONEN 1.8 - 1.21):"
          echo "=========================================================="
          cat bore.log
          echo "=========================================================="
          echo ""

          echo "🚀 STARTE MINECRAFT SERVER (6 GB RAM)..."
          java -Xms4G -Xmx6G -jar server.jar nogui
