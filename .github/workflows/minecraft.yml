name: Minecraft Cloud Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Minecraft Server & Playit
        run: |
          mkdir mc_server
          cd mc_server
          wget -O server.jar https://api.purpurmc.org/v2/purpur/1.21.1/latest/download
          echo "eula=true" > eula.txt
          wget -O playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          ./playit &
          java -Xms4G -Xmx6G -jar server.jar nogui
