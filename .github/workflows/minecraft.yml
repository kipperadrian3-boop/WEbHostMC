name: Minecraft Cloud Server

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_server]

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Start Minecraft Cloud Server & Tunnels
        run: |
          mkdir -p mc_server
          mkdir -p /tmp/playit
          mkdir -p ~/.config/playit_gg
          export XDG_RUNTIME_DIR=/tmp
          cd mc_server

          echo "⬇️ Lade Purpur 1.21.1 herunter..."
          wget -q https://api.purpurmc.org/v2/purpur/1.21.1/latest/download -O server.jar
          echo "eula=true" > eula.txt

          echo "⬇️ Lade Playit Cloud-Tunnel herunter..."
          wget -q https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -O playit
          chmod +x playit

          # Start Playit with environment socket fix
          ./playit > /tmp/playit.log 2>&1 &
          sleep 6

          echo "=========================================================="
          echo "🌐 DEINE SERVER-VERBINDUNG (PLAYIT.GG):"
          echo "=========================================================="
          cat /tmp/playit.log
          echo "=========================================================="
          echo ""

          echo "🚀 STARTE MINECRAFT SERVER (6 GB RAM)..."
          java -Xms4G -Xmx6G -jar server.jar nogui
